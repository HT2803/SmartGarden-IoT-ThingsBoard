<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Vườn Thông Minh IoT</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulseScale {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .animate-pulse-scale {
            animation: pulseScale 1.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <div id="root"></div>

    <script type="text/babel">
        const TB_BASE_URL = "https://thingsboard.cloud/api";
        const DEVICE_ID = "b162a250-5808-11f1-aa03-0f0d95b4aecc";

        function App() {
            const [isLoggedIn, setIsLoggedIn] = React.useState(false);
            const [username, setUsername] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [userRole, setUserRole] = React.useState('Guest'); 
            const [token, setToken] = React.useState('');
            const [errorMsg, setErrorMsg] = React.useState('');

            const [telemetry, setTelemetry] = React.useState({
                temperature: 0,
                humidity: 0,
                lux: 0,         
                soilPercent: 0  
            });

            const [ledState, setLedState] = React.useState(false);
            const [showSoilModal, setShowSoilModal] = React.useState(false);
            const [lastSoilStatus, setLastSoilStatus] = React.useState(false);

            const handleLogin = async (e) => {
                e.preventDefault();
                setErrorMsg('');

                if (username === 'guest') {
                    setIsLoggedIn(true);
                    setUserRole('Guest');
                    setToken('public-access-no-token');
                    return;
                }

                try {
                    const response = await fetch(`${TB_BASE_URL}/auth/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });

                    if (!response.ok) throw new Error('Sai tài khoản hoặc mật khẩu!');

                    const data = await response.json();
                    setToken(data.token); 
                    setIsLoggedIn(true);

                    if (username.includes('admin')) {
                        setUserRole('Admin');
                    } else {
                        setUserRole('User');
                    }
                } catch (err) {
                    setErrorMsg(err.message || 'Lỗi kết nối server!');
                }
            };

            const handleLogout = () => {
                setIsLoggedIn(false);
                setToken('');
                setUserRole('Guest');
                setUsername('');
                setPassword('');
                setShowSoilModal(false);
            };

            React.useEffect(() => {
                if (!isLoggedIn) return;

                const fetchTelemetry = async () => {
                    try {
                        const headers = {};
                        if (userRole !== 'Guest') {
                            headers['Authorization'] = `Bearer ${token}`;
                        }

                        const response = await fetch(
                            `${TB_BASE_URL}/plugins/telemetry/DEVICE/${DEVICE_ID}/values/timeseries`,
                            { headers }
                        );
                        
                        if (response.ok) {
                            const data = await response.json();
                            
                            const currentSoilPercent = (100.0 - parseFloat(data.soilPercent?.[0]?.value || 0)).toFixed(1);
                            const isDryNow = parseFloat(currentSoilPercent) < 30.0;

                            setTelemetry({
                                temperature: parseFloat(data.temperature?.[0]?.value || 0).toFixed(1),
                                humidity: parseFloat(data.humidity?.[0]?.value || 0).toFixed(1),
                                lux: parseFloat(data.lux?.[0]?.value || 0).toFixed(1),
                                soilPercent: currentSoilPercent
                            });

                            const currentLed = data.ledState?.[0]?.value;
                            setLedState(currentLed == "1" || currentLed == "true" || currentLed == true || currentLed == "ON");

                            if (isDryNow && !lastSoilStatus) {
                                setShowSoilModal(true);
                            }
                            if (!isDryNow) {
                                setShowSoilModal(false);
                            }
                            
                            setLastSoilStatus(isDryNow);
                        }
                    } catch (err) {
                        console.error("Lỗi lấy dữ liệu cảm biến:", err);
                    }
                };

                fetchTelemetry();
                const interval = setInterval(fetchTelemetry, 2000); 
                return () => clearInterval(interval);
            }, [isLoggedIn, token, userRole, lastSoilStatus]);

            if (!isLoggedIn) {
                return (
                    <div class="max-w-md mx-auto mt-28 p-8 bg-white rounded-xl shadow-lg border border-gray-200 font-sans">
                        <h2 class="text-center text-2xl font-bold text-green-700">VƯỜN THÔNG MINH IoT</h2>
                        <p class="text-center text-xs text-gray-500 mt-1 mb-6">Đăng nhập để xem hệ thống giám sát tự động</p>
                        <form onSubmit={handleLogin} class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Tài khoản:</label>
                                <input type="text" value={username} onChange={(e) => setUsername(e.target.value)} required class="w-full mt-1 p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500 focus:outline-none" placeholder="admin@gmail.com / user@gmail.com / guest" />
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Mật khẩu:</label>
                                <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} class="w-full mt-1 p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500 focus:outline-none" placeholder="Bỏ trống nếu là guest" />
                            </div>
                            {errorMsg && <p class="text-red-500 text-sm font-semibold">{errorMsg}</p>}
                            <button type="submit" class="w-full py-2 bg-green-700 text-white font-bold rounded-md hover:bg-green-800 transition duration-200">ĐĂNG NHẬP</button>
                        </form>
                    </div>
                );
            }

            return (
                <div class="max-w-4xl mx-auto p-6 font-sans relative">
                    
                    {showSoilModal && (
                        <div class="mb-6 p-4 bg-red-100 border-2 border-red-400 rounded-xl shadow-md flex justify-between items-center animate-pulse-scale transition duration-300">
                            <div class="flex items-center space-x-3">
                                <span class="text-2xl">⚠️</span>
                                <div>
                                    <h4 class="font-bold text-red-800 text-base">CẢNH BÁO HỆ THỐNG</h4>
                                    <p class="text-sm text-red-700 font-semibold">ĐẤT KHÔ! CẦN TƯỚI NGAY (Độ ẩm hiện tại: {telemetry.soilPercent}%)</p>
                                </div>
                            </div>
                            <button 
                                onClick={() => setShowSoilModal(false)} 
                                class="bg-red-200 hover:bg-red-300 text-red-800 font-bold w-8 h-8 rounded-full flex items-center justify-center transition duration-200 focus:outline-none"
                                title="Tắt thông báo"
                            >
                                ✕
                            </button>
                        </div>
                    )}

                    <div class="flex justify-between items-center border-b-2 border-green-700 pb-4 mb-6">
                        <h1 class="text-xl md:text-2xl font-bold text-gray-800">HỆ THỐNG GIÁM SÁT VƯỜN THÔNG MINH</h1>
                        <div class="flex items-center space-x-3">
                            <span class="bg-green-100 text-green-800 px-3 py-1 rounded-full text-sm font-bold">
                                Trạng thái: Kết nối Live
                            </span>
                            <button onClick={handleLogout} class="bg-red-500 text-white px-3 py-1 rounded-md text-sm hover:bg-red-600 transition">Đăng xuất</button>
                        </div>
                    </div>

                    <h3 class="text-lg font-semibold text-gray-700 mb-3">📊 Thông số cảm biến thời gian thực</h3>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                        <div class="p-4 bg-yellow-50 rounded-lg border border-yellow-200 text-center shadow-sm">
                            <h4 class="text-sm text-gray-500 font-medium">🌡️ Nhiệt độ</h4>
                            <h2 class="text-xl font-bold text-yellow-700 mt-1">{telemetry.temperature} °C</h2>
                        </div>
                        <div class="p-4 bg-blue-50 rounded-lg border border-blue-200 text-center shadow-sm">
                            <h4 class="text-sm text-gray-500 font-medium">💧 Độ ẩm không khí</h4>
                            <h2 class="text-xl font-bold text-blue-700 mt-1">{telemetry.humidity} %</h2>
                        </div>
                        
                        <div class={`p-4 rounded-lg border text-center shadow-sm transition duration-300 ${ledState ? 'bg-green-100 border-green-300' : 'bg-purple-50 border-purple-200'}`}>
                            <h4 class="text-sm text-gray-500 font-medium">☀️ Ánh sáng</h4>
                            <h2 class={`text-xl font-bold mt-1 ${ledState ? 'text-green-700' : 'text-purple-700'}`}>
                                {telemetry.lux} Lux
                            </h2>
                            <span class={`text-xs font-bold block mt-1 ${ledState ? 'text-green-600 animate-pulse' : 'text-purple-500'}`}>
                                {ledState ? "💡 ĐÈN BẬT" : "💤 ĐÈN TẮT"}
                            </span>
                        </div>

                        <div class="p-4 bg-amber-50 rounded-lg border border-amber-200 text-center shadow-sm">
                            <h4 class="text-sm text-gray-500 font-medium">🌱 Độ ẩm đất</h4>
                            <h2 class="text-xl font-bold text-amber-700 mt-1">{telemetry.soilPercent} %</h2>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
